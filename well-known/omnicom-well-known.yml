summary: >-
  No /.well-known/ discovery document is published on any Omnicom host. The
  corporate site (www.omc.com, WordPress + Yoast behind Imperva) returns a true
  HTTP 404 with an HTML 404 page for every probed path. The legacy corporate
  domain www.omnicomgroup.com 301-redirects everything to www.omc.com. The Omni
  platform host omni.omc.com is an Angular single-page application that
  301-redirects every unknown path to /home/ and then serves the same HTML shell
  with HTTP 200 — a catch-all, NOT a document. No raw files were saved because
  no probe returned a real document, and NO WellKnown, SecurityTxt, APICatalog
  or AgentCard pointer is wired in apis.yml.
