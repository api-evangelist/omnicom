description: >-
  Omnicom Group Inc. (NYSE: OMC) is the world's largest marketing and sales
  communications holding company, formed in its current shape when Omnicom
  completed its acquisition of Interpublic Group on 26 November 2025, combining
  pro forma revenue in excess of $25 billion. The company operates across
  advertising, media, precision marketing, commerce, public relations,
  healthcare, branding, experiential and production, serving clients in more
  than 100 countries through agency networks including BBDO, DDB, TBWA, OMD,
  PHD, Hearts & Science, McCann, FCB, Mediabrands, Flywheel and Acxiom. Its
  Omni platform — built and operated by Annalect, Omnicom's data, technology
  and AI division — is marketed as an AI-driven marketing intelligence
  operating system spanning orchestration, production, predictive intelligence
  and outcome-driven activation, and is grounded in Acxiom Real ID identity
  data. As of the 2026-08-12 probe, Omnicom publishes no public developer
  program: no developer portal, API reference, OpenAPI/AsyncAPI/GraphQL
  document, SDK, MCP server or A2A agent card is served from any Omnicom host.
  The corporate site moved from omnicomgroup.com to omc.com, which 301-redirects
  the legacy domain.
